name: Confluence
options:
  bundleIdPrefix: com.bilal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  SignalEngine:
    path: Packages/SignalEngine
  Pow:
    url: https://github.com/EmergeTools/Pow
    revision: 1b4b1dda28c50b95f0872927ee2226fe8b58950e
  PopupView:
    url: https://github.com/exyte/PopupView
    from: 5.0.9
  SwiftUI-Shimmer:
    url: https://github.com/markiv/SwiftUI-Shimmer
    from: 1.5.1
  LightweightChartsIOS:
    url: https://github.com/tradingview/LightweightChartsIOS
    from: 5.2.0

targets:
  Confluence:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Confluence/App
      - path: Confluence/Data
      - path: Confluence/Services
      - path: Confluence/UI
      - path: Confluence/Resources/Assets.xcassets
      - path: Confluence/Resources/Sounds/terminal_chime.caf
        buildPhase: resources
      - path: Confluence/Resources/Sounds/sonar_pulse.caf
        buildPhase: resources
      - path: Confluence/Resources/Sounds/vault_lock.caf
        buildPhase: resources
      - path: Confluence/Resources/Sounds/trap_warning.caf
        buildPhase: resources
      - path: Confluence/Resources/Sounds/news_release_ping.caf
        buildPhase: resources
    info:
      path: Confluence/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Confluence
        PRODUCT_BUNDLE_IDENTIFIER: com.bilal.confluence
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SignalEngine
        product: SignalEngine
      - package: Pow
        product: Pow
      - package: PopupView
        product: PopupView
      - package: SwiftUI-Shimmer
        product: Shimmer
      - package: LightweightChartsIOS
        product: LightweightCharts

  ConfluenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConfluenceTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.bilal.confluence.tests
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - target: Confluence
      - package: SignalEngine
        product: SignalEngine

schemes:
  Confluence:
    build:
      targets:
        Confluence: all
        ConfluenceTests: [test]
    test:
      config: Debug
      targets:
        - ConfluenceTests
    archive:
      config: Release
