name: Build Unsigned Confluence IPA

on:
  push:
    branches: ["main", "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-ipa:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode & Generate Deterministic Assets/Sounds
        run: |
          xcodebuild -version
          swift --version
          python3 scripts/generate_sounds.py
          python3 scripts/generate_assets.py
          for f in Confluence/Resources/Sounds/*.caf; do
            echo "Validating audio container: $f"
            afinfo "$f"
          done

      - name: Run Schema & CI Hygiene Checks
        run: |
          python3 scripts/verify_schema_and_ci_hygiene.py

      - name: Run Pure Swift SignalEngine Unit & Walk-Forward Tests
        run: |
          swift test --package-path Packages/SignalEngine --parallel -Xswiftc -warnings-as-errors

      - name: Install XcodeGen & Generate Confluence.xcodeproj
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Confluence.xcodeproj \
            -scheme Confluence

      - name: Run iOS App Integration Tests on Simulator
        run: |
          SIM_UDID=$(xcrun simctl list devices available iPhone --json | jq -r '[.devices[] | .[] | select(.isAvailable==true)] | first.udid // empty')
          if [ -z "$SIM_UDID" ]; then
            echo "FAIL: No available iPhone Simulator runtime found!"
            exit 1
          fi
          echo "Using Simulator UDID: $SIM_UDID"
          xcodebuild test \
            -project Confluence.xcodeproj \
            -scheme Confluence \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Build Unsigned Release iphoneos App
        run: |
          xcodebuild build \
            -project Confluence.xcodeproj \
            -scheme Confluence \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify App Bundle Integrity & Package Unsigned Confluence.ipa
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Confluence.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Confluence"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Verified CFBundleIdentifier: $BUNDLE_ID"
          test "$BUNDLE_ID" = "com.bilal.confluence"

          echo "Running built bundle secret leak guard..."
          PLIST_XML=$(plutil -convert xml1 -o - "$APP_PATH/Info.plist")
          if echo "$PLIST_XML" | grep -q "ConfluenceDefaultTwelveDataKey"; then
            echo "FAIL: Built Info.plist contains forbidden ConfluenceDefaultTwelveDataKey!"
            exit 1
          fi
          if echo "$PLIST_XML" | grep -Eq "<string>(AIza[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z_-]{16,}|[0-9a-fA-F]{32,})</string>"; then
            echo "FAIL: Built Info.plist contains a secret/API-key-like string!"
            exit 1
          fi
          while IFS= read -r -d '' cfg; do
            if grep -Eq "(AIza[0-9A-Za-z_-]{20,}|sk-(or-)?[0-9A-Za-z_-]{16,}|ConfluenceDefaultTwelveDataKey)" "$cfg"; then
              echo "FAIL: Bundled config file contains secret-like token: $cfg"
              exit 1
            fi
          done < <(find "$APP_PATH" -maxdepth 4 \( -name "*.plist" -o -name "*.json" \) -print0)
          echo "Verified built bundle contains zero embedded API keys."

          for caf in terminal_chime.caf sonar_pulse.caf vault_lock.caf trap_warning.caf news_release_ping.caf; do
            test -f "$APP_PATH/$caf" || { echo "Missing $caf in Confluence.app root!"; exit 1; }
          done

          echo "Asserting zero removed chart framework bundles inside app bundle..."
          REMOVED_BUNDLES=$(find "$APP_PATH" -maxdepth 4 \( -iname "*lightweight*" -o -iname "*SwiftTradingView*" \) -print)
          if [ -n "$REMOVED_BUNDLES" ]; then
            echo "FAIL: Found removed chart package artifacts in Confluence.app:"
            echo "$REMOVED_BUNDLES"
            exit 1
          fi
          echo "Verified zero LightweightCharts or external SwiftTradingView bundles in Confluence.app."

          rm -rf build/Payload Confluence.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/Confluence.app
          rm -rf build/Payload/Confluence.app/_CodeSignature build/Payload/Confluence.app/embedded.mobileprovision
          (cd build && zip -qry ../Confluence.ipa Payload)
          unzip -tq Confluence.ipa
          if unzip -l Confluence.ipa | grep -Eq "(_CodeSignature/|embedded\.mobileprovision)"; then
            echo "FAIL: Unsigned IPA unexpectedly contains code signature or provisioning profile!"
            exit 1
          fi
          ls -lh Confluence.ipa

      - name: Upload Unsigned Confluence.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Confluence-unsigned-ipa
          path: Confluence.ipa
          retention-days: 30

      - name: Attach Confluence.ipa to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Confluence.ipa
